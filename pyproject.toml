[project]
name = "codestra-marketing"
version = "0.2.0"
description = "Codestra paid acquisition and marketing control plane"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "pydantic>=2.11,<3", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
