name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python -m compileall -q app
      - run: python -c "from app.main import app, LIVE_ADVERTISING_ENABLED; assert app; assert LIVE_ADVERTISING_ENABLED is False"
      - run: python -c "from app.providers.meta import MetaAdsConnector; assert MetaAdsConnector.live_writes_enabled is False"
